name: tests

on:
  push:
  pull_request:

jobs:
  offline:
    env:
      EXP2CPFE_TEST_PROFILE: offline
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs --strict-markers
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify installed wheel outside the checkout
        env:
          EXP2CPFE_WHEEL_DIR: dist
        run: python -m pytest -q -rs --strict-markers tests/integration/test_installed_wheel.py

  cpu-training:
    runs-on: ubuntu-latest
    env:
      EXP2CPFE_TEST_PROFILE: cpu-training
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,training]"
      - name: Require CPU training dependencies
        run: python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
      - name: Build collections and exercise real optimization and checkpoint readback
        run: python -m pytest -q -rs --strict-markers tests/unit/test_training_dataset.py tests/unit/test_training_specimens.py tests/unit/test_gh4169_example.py tests/unit/test_surrogate_training.py tests/integration/test_training_dataset_pipeline.py

  paramaterial-case:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build pytest
      - run: python -m pip install -r examples/paramaterial_tensile/requirements.txt
      - run: python -m build --wheel
      - name: Install the public wheel for the real case
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0]])"
      - name: Verify the example and its installed-package workflow
        run: python -m pytest -q examples/paramaterial_tensile/tests

  cpu-ml:
    runs-on: ubuntu-latest
    env:
      EXP2CPFE_TEST_PROFILE: ml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,ml]"
      - name: Require CPU Torch and PyG
        run: python -c "import torch, torch_geometric; assert torch.version.cuda is None; print(torch.__version__, torch_geometric.__version__)"
      - name: Exercise real PyG serialization and readback
        run: python -m pytest -q -rs --strict-markers tests/unit/test_derived_exports.py::test_pyg_is_real_data_with_portable_full_payload
      - name: Run the complete suite with ML dependencies
        run: python -m pytest -q -rs --strict-markers
