[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-to-cpfe"
version = "0.3.1"
description = "A provenance-preserving experiment-to-multiphysics data pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    "pydantic>=2,<3",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
    "scipy",
    "openpyxl",
]
native = ["scipy", "openpyxl"]
training = ["torch>=2.6", "scipy"]
ml = [
    "torch",
    "torch-geometric",
]

[project.urls]
Repository = "https://github.com/koocmitwho/experiment-to-cpfe-pipeline"
Documentation = "https://github.com/koocmitwho/experiment-to-cpfe-pipeline/blob/v0.3.1/README.md"
Issues = "https://github.com/koocmitwho/experiment-to-cpfe-pipeline/issues"
Changelog = "https://github.com/koocmitwho/experiment-to-cpfe-pipeline/blob/v0.3.1/CHANGELOG.md"
Releases = "https://github.com/koocmitwho/experiment-to-cpfe-pipeline/releases"

[project.scripts]
pipeline = "experiment_to_cpfe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"experiment_to_cpfe" = ["py.typed"]
"experiment_to_cpfe._resources" = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-rs --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
